services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihelms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihelms}
      POSTGRES_DB: ${POSTGRES_DB:-aihelms}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelms}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aihelms}
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelms}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.85.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    command: ["--config", "/app/config.yaml"]
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy

  aihelms:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/aihelms:${AIHELMS_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aihelms}@redis:6379/0
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY:-aihelms}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      USD_TO_CNY_RATE: ${USD_TO_CNY_RATE:-7}
      LLM_LOG_SYNC_INTERVAL_MINUTES: ${LLM_LOG_SYNC_INTERVAL_MINUTES:-5}
      LLM_LOG_RETENTION_DAYS: ${LLM_LOG_RETENTION_DAYS:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-0}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      GUNICORN_LOGLEVEL: ${GUNICORN_LOGLEVEL:-info}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-0}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-info}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_PREFETCH_MULTIPLIER:-1}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
      AI_POLICIES_SCANNER_URL: http://skillspector:8010
      AI_POLICIES_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      WEB_PORT: ${WEB_PORT:-80}
      LITELLM_PORT: ${LITELLM_PORT:-4000}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_DIR: /logs
      DATA_DIR: /app/data
    volumes:
      - ./logs:/logs
      - ./data:/app/data
      - frontend_dist:/frontend
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
      skillspector:
        condition: service_started

  skillspector:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/skillspector:${SKILLSPECTOR_VERSION:-0.1.0}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    environment:
      SKILLSPECTOR_SERVICE_INPUT_ROOT: /scan-input
      SKILLSPECTOR_SERVICE_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      SKILLSPECTOR_LOG_LEVEL: ${SKILLSPECTOR_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/skills:/scan-input/skills:ro
    networks:
      - internal

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
      - frontend_dist:/usr/share/nginx/html:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - internal
      - external
    depends_on:
      - aihelms

volumes:
  pgdata:
  redisdata:
  frontend_dist:

networks:
  internal:
    internal: true
  external:
