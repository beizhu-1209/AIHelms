services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihelms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihelms}
      POSTGRES_DB: ${POSTGRES_DB:-aihelms}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelms}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aihelms}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelms}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-change-me}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT}:4000"
    command: ["--config", "/app/config.yaml"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  skillspector:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/skillspector:${SKILLSPECTOR_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      SKILLSPECTOR_SERVICE_INPUT_ROOT: /scan-input
      SKILLSPECTOR_SERVICE_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      SKILLSPECTOR_LOG_LEVEL: ${SKILLSPECTOR_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/skills:/scan-input/skills:ro
    ports:
      - "${SKILLSPECTOR_PORT:-8010}:8010"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  dsh:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/dsh-manager:${DSH_MANAGER_VERSION}
    restart: unless-stopped
    environment:
      DSH_ENABLED: ${DSH_ENABLED:-false}
      DSH_RUNTIME_IMAGE: registry.cn-zhangjiakou.aliyuncs.com/microbaton/dsh:${DSH_VERSION}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      DSH_USER_NETWORK: ${DSH_USER_NETWORK:-aihelms-dsh-user}
      DSH_CONTAINER_IDLE_TIMEOUT_SECONDS: ${DSH_CONTAINER_IDLE_TIMEOUT_SECONDS:-1800}
      DSH_CONTAINER_RECLAIM_GRACE_SECONDS: ${DSH_CONTAINER_RECLAIM_GRACE_SECONDS:-60}
      DSH_CONTAINER_START_TIMEOUT_SECONDS: ${DSH_CONTAINER_START_TIMEOUT_SECONDS:-30}
      DSH_CONTAINER_MAX_COUNT: ${DSH_CONTAINER_MAX_COUNT:-20}
      SECRET_KEY: ${SECRET_KEY:-aihelms}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dsh_control
      - dsh_user

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./docker/nginx/dev.default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    depends_on:
      - dsh
    networks:
      - default
      - dsh_control
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:

networks:
  dsh_control:
    name: ${DSH_CONTROL_NETWORK:-aihelms-dsh-control}
  dsh_user:
    name: ${DSH_USER_NETWORK:-aihelms-dsh-user}
