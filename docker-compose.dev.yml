# 开发测试用 docker-compose
# 首次使用: docker compose -f docker-compose.dev.yml up -d --build
# 日常启动: docker compose -f docker-compose.dev.yml up -d
# 仅当 pyproject.toml 依赖变更时才需要重新 --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihelms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihelms}
      POSTGRES_DB: ${POSTGRES_DB:-aihelms}
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelms}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aihelms}
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelms}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aihelms:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: aihelms-dev
    restart: unless-stopped
    working_dir: /app/apps
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aihelms}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./apps:/app/apps
    ports:
      - "${AIHELMS_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  celery:
    image: aihelms-dev
    restart: unless-stopped
    working_dir: /app/apps
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aihelms}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./apps:/app/apps
    depends_on:
      aihelms:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]

volumes:
  pgdata_dev:
  redisdata_dev:
